[data-style="material"] .trow .tt { font-weight: 500; font-size: 15px; }
[data-style="material"] .trow .ta { font-size: 13px; }
[data-style="material"] .trow.playing { background: var(--island); }
[data-style="material"] .trow.playing .tt { color: var(--hot); font-weight: 600; }
[data-style="material"] .trow.playing .num { color: var(--hot); }
[data-style="material"] .trow-head { font-family: var(--font); }

/* Состояния кнопок-значков — после общего цвета значков */
[data-style="material"] .iconbtn.hot { color: var(--hot); }
[data-style="material"] .iconbtn.lit { color: var(--hot); }
[data-style="material"] .iconbtn.neg { color: var(--bad); }
[data-style="material"] .iconbtn.filled { background: var(--m-ctl); color: var(--text); }

/* =================== Шапка альбома и артиста =================== */
[data-style="material"] .hero { gap: 28px; padding: 16px 0 24px; }
[data-style="material"] .hero-title { font-size: clamp(32px, 5cqi, 48px); line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 10px; }

/* =================== Жанры =================== */
/* Серая плитка, название слева, справа — квадрат точек цвета жанра */
[data-style="material"] .genre-tile { height: 72px; border-radius: 14px; padding: 0 16px; background: var(--island); align-items: center; }
[data-style="material"] .genre-tile::after {
  content: ""; position: absolute; right: 16px; top: 50%; width: 40px; height: 40px; margin-top: -20px;
  background: radial-gradient(circle, oklch(var(--dot-l) 0.13 var(--gh)) 0 2.5px, transparent 3px) 0 0 / 10px 10px;
}
[data-style="material"] .genre-name { background: none; padding: 0; font-size: 15px; font-weight: 600; letter-spacing: 0; }
@media (hover: hover) { [data-style="material"] .genre-tile:hover { background: var(--bg2); } }

/* =================== Плеер внизу (компьютер) =================== */
[data-style="material"] .island { background: var(--m-s2); border: none; box-shadow: var(--island-shadow); height: 76px; border-radius: 38px; }
[data-style="material"] .island.square { border-radius: 16px; }
[data-style="material"] .dock { background: var(--m-s2); box-shadow: 0 -1px 0 var(--line), 0 -6px 24px rgba(0, 0, 0, 0.35); }
[data-style="material"] .dock-cell { border-right: none; }

/* =================== Настройки =================== */
/* Переключатель — группа кнопок: внешние углы 12, внутренние 4, выбранная — цветом обложки и с галочкой */
[data-style="material"] .seg { background: none; padding: 0; gap: 2px; border-radius: 0; }
[data-style="material"] .seg-btn { height: 40px; padding: 0 14px; border-radius: 4px; background: var(--m-ctl); color: var(--text); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
[data-style="material"] .seg-btn:first-child { border-radius: 12px 4px 4px 12px; }
[data-style="material"] .seg-btn:last-child { border-radius: 4px 12px 12px 4px; }
[data-style="material"] .seg-btn.is-on { background: var(--acc); color: var(--acc-ink); font-weight: 700; }
[data-style="material"] .seg-btn.is-on::before {
  content: "check"; font-family: 'Material Symbols Rounded'; font-size: 18px; line-height: 1; font-weight: normal;
  font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20;
}
[data-style="material"] .style-card { outline: none; box-shadow: inset 0 0 0 1px var(--m-outline); border-radius: 16px; padding: 6px; }
[data-style="material"] .style-card.is-on { box-shadow: inset 0 0 0 2px var(--acc); }
[data-style="material"] .style-name { font-weight: 600; font-size: 14px; }
[data-style="material"] .set-row { border-bottom-color: var(--line); }

/* =================== Роли крупного текста =================== */
[data-style="material"] .ty-light, [data-style="material"] .ty-reg { font-weight: 650; letter-spacing: -0.02em; }

/* =================== Полный экран =================== */
/* Фон — ровный, без точечной сетки; свечение цветом обложки не нужно: цвет и так у кнопок */
[data-style="material"] .fs, [data-style="material"] .fsp { background: var(--bg0); }
[data-style="material"] .fs .btn.fs-collapse { font-family: var(--font); font-size: 14px; letter-spacing: 0; text-transform: none; background: transparent; padding: 0 14px 0 8px; font-weight: 600; }
[data-style="material"] .fs-title { font-size: clamp(32px, 3.6vw, 48px); line-height: 1.12; letter-spacing: -0.02em; }
[data-style="material"] .follow-pill { font-family: var(--font); font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; padding: 0 12px; height: 32px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--m-outline); color: var(--text); }
[data-style="material"] .net-chip { font-family: var(--font); font-size: 13px; letter-spacing: 0; text-transform: none; border-radius: 8px; padding: 6px 10px; box-shadow: inset 0 0 0 1px var(--m-outline); }
[data-style="material"] .fsp-handle { background: var(--m-outline); }

/* =================== Поля, тосты, окна, меню =================== */
/* Поле суммы — залитое, скругление 12; выбрано или в фокусе — кольцо цвета обложки */
[data-style="material"] .amt-field { border-radius: 12px; background: var(--bg2); box-shadow: none; min-height: 44px; }
[data-style="material"] .amt-field.is-on, [data-style="material"] .amt-field:focus-within { box-shadow: inset 0 0 0 2px var(--acc); background: var(--bg2); color: var(--text); }
[data-style="material"] .amt-field.amt-fill.is-on { background: var(--bg2); color: var(--text); }
[data-style="material"] .amt-field .mono, [data-style="material"] .chip.mono { font-family: var(--font); }

/* Тост — тёмная плашка со скруглением 12 (снизу на светлой теме — тёмная, на тёмной — светлая) */
[data-style="material"] .toast { border-radius: 12px; font-size: 14px; text-align: left; padding: 12px 16px; box-shadow: var(--shadow); }
[data-style="material"] .toast.has-action { padding: 6px 6px 6px 16px; }
[data-style="material"] .toast-act { border-radius: 10px; background: transparent; color: var(--m-acc-l, var(--bg0)); font-weight: 700; }
[data-style="material"][data-mtheme="light"] .toast-act { color: var(--m-acc-d, var(--bg0)); }

/* Окна и листы: поверхность-3, скругление 20 (лист снизу — 24 сверху), тень */
[data-style="material"] .modal { background: var(--m-s3); border: none; border-radius: 20px; box-shadow: var(--shadow); }
[data-style="material"] .pop { background: var(--m-s3); border: none; border-radius: 16px; box-shadow: var(--shadow); }
@media (hover: hover) { [data-style="material"] .pop-item:hover { background: var(--bg3); } }
@media (max-width: 640px) {
  [data-style="material"] .modal { border-radius: 24px 24px 0 0; box-shadow: 0 48px 0 var(--m-s3), var(--shadow); }
  [data-style="material"] .sheet-grip span { width: 32px; background: var(--m-outline); }
}

/* Шкала оценки в плеере — не точки, а короткие черты */
[data-style="material"] .rate-inline .rate-cell > i { width: 5px; height: 14px; border-radius: 2.5px; }
[data-style="material"] .rate-inline .rate-cell > i.is-on { background: var(--hot); }
[data-style="material"] .rate-pop .rate-cell > i { width: 16px; height: 22px; border-radius: 6px; }

/* ---------- Онбординг ----------
   Как в одобренных макетах: точки шагов наверху (активная — капсула), текст слева,
   главная кнопка 52 px во всю ширину; на телефоне она прижата к низу экрана */
[data-style="material"] .ob { padding: env(safe-area-inset-top) 24px calc(24px + env(safe-area-inset-bottom)); }
[data-style="material"] .ob-top { display: grid; grid-template-columns: 1fr auto 1fr; min-height: 56px; }
[data-style="material"] .ob-top > :first-child { justify-self: start; margin-left: -10px; }
[data-style="material"] .ob-top > :last-child { justify-self: end; }
[data-style="material"] .ob-dots { gap: 6px; }
[data-style="material"] .ob-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--bg3); transition: width var(--t-2) var(--ease), background var(--t-2) var(--ease); }
[data-style="material"] .ob-dot.is-on { width: 20px; background: var(--text); }
[data-style="material"] .ob-inner { text-align: left; align-items: flex-start; }
[data-style="material"] .ob-foot:empty { display: none; }
[data-style="material"] .btn.ob-cta { align-self: stretch; max-width: 520px; min-height: 52px; padding: 0 24px; border-radius: 16px; font-size: 16px; }
[data-style="material"] .ob-cta-gap { margin-top: 28px; }
/* Второе действие под главной кнопкой («У меня уже есть аккаунт», «Решу позже») — по центру, во всю ширину */
[data-style="material"] .ob-inner > .ob-alt { align-self: stretch; min-height: 48px; margin-top: 4px; text-align: center; font-size: 15px; font-weight: 600; color: var(--m-icon); }
[data-style="material"] .ob-amts { justify-content: flex-start; }
[data-style="material"] .ob-styles { justify-content: start; }
[data-style="material"] .ob-mcolors { align-items: flex-start; }
@media (max-width: 640px) {
  [data-style="material"] .ob-inner { flex: 1 0 auto; margin-block: 0; padding-top: 12px; }
  [data-style="material"] .ob-inner > .ob-cta { margin-top: auto; }
  [data-style="material"] .ob-mcolors { margin-bottom: 28px; }
}
/* Шаг «Три вещи» — одна карточка, пункты списком */
.ob-tour { align-self: stretch; max-width: 520px; background: var(--m-s2); border-radius: 20px; padding: 8px 20px; box-shadow: var(--island-shadow); }
.ob-tour-row { display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; }
.ob-tour-row + .ob-tour-row { border-top: 1px solid var(--bg3); }
.ob-tour-ic { width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--m-ctl); color: var(--text); }
.ob-tour-row:first-child .ob-tour-ic { color: var(--hot); }
.ob-tour-t { display: block; font-size: 17px; line-height: 24px; font-weight: 650; }
.ob-tour-s { display: block; margin-top: 4px; font-size: 15px; line-height: 22px; color: var(--mut); text-wrap: pretty; }
/* Веер обложек на первом шаге: размеры от --fan (центральная обложка), пропорции макета 412 px */
.ob-fan { --fan: clamp(96px, 22vh, 196px); --fan-s: calc(var(--fan) * 0.857); position: relative; align-self: stretch; height: calc(var(--fan) * 1.33); margin: 4px 0 8px; }
.ob-fan > span { position: absolute; left: 50%; display: block; }
