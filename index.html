<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Doto:ROND,wght@0..100,100..900&display=swap" rel="stylesheet">
<script>
  // Версия файлов прототипа — время выкладки этой страницы (Last-Modified от GitHub Pages).
  // Pages разрешает браузеру 10 минут брать файлы из кэша, а обычное обновление страницы
  // перепроверяет только сам HTML: сразу после выкладки новая страница собиралась из старых
  // скриптов и стилей — исправленное казалось неисправленным, смесь версий роняла приложение.
  // С версией в адресе новая выкладка — новые адреса файлов; между выкладками кэш работает как обычно
  var SPOTLESS_V = document.lastModified.replace(/\D/g, "");
  // ?r= приходит из 404.html (обход кэша при переходе со старого адреса) — в строке адреса он не нужен
  if (/[?&]r=/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);
  document.write('<link rel="stylesheet" href="css/app.css?v=' + SPOTLESS_V + '">');
</script>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
  document.write('<script src="js/data.js?v=' + SPOTLESS_V + '"><\/script><script src="js/i18n.js?v=' + SPOTLESS_V + '"><\/script>');
</script>
<script type="text/babel" src="js/core.jsx"></script>
<script type="text/babel" src="js/ui.jsx"></script>
<script type="text/babel" src="js/rating.jsx"></script>
<script type="text/babel" src="js/track.jsx"></script>
<script type="text/babel" src="js/player.jsx"></script>
<script type="text/babel" src="js/queue.jsx"></script>
<script type="text/babel" src="js/fullscreen.jsx"></script>
<script type="text/babel" src="js/miniplayer.jsx"></script>
<script type="text/babel" src="js/pages-home.jsx"></script>
<script type="text/babel" src="js/pages-album.jsx"></script>
<script type="text/babel" src="js/pages-playlist.jsx"></script>
<script type="text/babel" src="js/pages-social.jsx"></script>
<script type="text/babel" src="js/pages-support.jsx"></script>
<script type="text/babel" src="js/pages-settings.jsx"></script>
<script type="text/babel" src="js/menus.jsx"></script>
<script type="text/babel" src="js/onboarding.jsx"></script>
<script type="text/babel" src="js/storage.jsx"></script>
<script type="text/babel" src="js/state.jsx"></script>
<script type="text/babel" src="js/shell.jsx"></script>
<script type="text/babel" src="js/app.jsx"></script>
<script>
  // Файлы выше скачиваем сами и отдаём Babel готовым текстом. Его собственный загрузчик ненадёжен:
  // ответ 304 (Firefox при перепроверке кэша) он пропускал, а запрос, который не дошёл (оборвалась
  // связь или его заблокировали: статус 0), считал успешным — пустой файл молча «выполнялся»,
  // приложение открывалось без него и падало, когда файл понадобился (полный экран на телефоне:
  // «FullScreenPhone is not defined»). Здесь у каждого файла проверяются ответ и текст, до трёх попыток;
  // адрес — с версией выкладки, так что между выкладками файлы берутся из кэша
  Babel.disableScriptTags();

  // Одна перезагрузка, не чаще раза в 30 секунд — чтобы не уйти в круг. true — уже перезагружаемся
  var reloadOnce = function () {
    try {
      if (Date.now() - (+sessionStorage.getItem("spotless_retry") || 0) < 30000) return false;
      sessionStorage.setItem("spotless_retry", String(Date.now()));
    } catch (e) { return false; }
    location.reload();
    return true;
  };

  // Файл так и не пришёл и перезагрузка не помогла: говорим об этом сразу, с именем файла, —
  // а не открываем приложение, которое сломается позже. Вид — как у экрана ошибки (AppCrash)
  var notLoaded = function (file) {
    if (reloadOnce()) return;
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem("spotless_proto_v1")) || {}; } catch (e) {}
    if (saved.theme) document.documentElement.setAttribute("data-theme", saved.theme);
    var t = (window.I18N || {})[saved.lang === "en" ? "en" : "ru"] || {};
    var root = document.getElementById("root");
    root.innerHTML = '<div class="ob" role="alert" style="align-items: center; justify-content: center; gap: 14px; text-align: center">'
      + '<h1 style="font-size: 34px"></h1><p style="font-size: 14.5px; color: var(--mut); max-width: 420px; line-height: 1.6; text-wrap: pretty"></p>'
      + '<code class="mono" style="font-size: 11px; line-height: 1.5; color: var(--mut2); user-select: all"></code>'
      + '<button class="btn" style="margin-top: 8px"></button></div>';
    root.querySelector("h1").textContent = t.errTitle || "Что-то пошло не так";
    root.querySelector("p").textContent = t.loadNote || "";
    root.querySelector("code").textContent = file;
    root.querySelector("button").textContent = t.reloadPage || "↻";
    root.querySelector("button").onclick = function () { location.reload(); };
  };

  (function () {
    var get = function (url, n) {
      return fetch(url, n ? { cache: "reload" } : undefined)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        // пустой ответ или страница вместо файла (её отдаёт, например, сеть с авторизацией)
        .then(function (text) { if (!text.trim() || /^\s*</.test(text)) throw new Error("bad body"); return text; })
        .catch(function (e) {
          if (n >= 2) throw e;
          return new Promise(function (ok) { setTimeout(ok, 700 * (n + 1)); }).then(function () { return get(url, n + 1); });
        });
    };
    var tags = [].slice.call(document.querySelectorAll('script[type="text/babel"][src]'));
    Promise.all(tags.map(function (s) {
      var src = s.getAttribute("src");
      return get(src + "?v=" + SPOTLESS_V, 0).then(function (text) {
        s.removeAttribute("src");
        s.setAttribute("data-module", src); // имя файла — в ошибках и в отладчике
        s.textContent = text;
      }, function () { throw src; });
    })).then(function () { Babel.transformScriptTags(); }, notLoaded);
  })();

  // Не пришли данные или строки (data.js, i18n.js — их грузит браузер): приложение при запуске падает
  // на «… is not defined». Пока оно не открылось — та же одна перезагрузка. Ошибки в уже открытом
  // приложении сюда не относятся
  window.addEventListener("error", function (e) {
    if (document.querySelector(".shell, .ob:not([role=alert])")) return;
    if (/is not defined|Can't find variable/.test(e.message || "")) reloadOnce();
  });
</script>
</body>
</html>
